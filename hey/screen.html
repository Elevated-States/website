<script>

(function(){
  var Q=new URLSearchParams(location.search), C=CITY, st=document.getElementById("stage");

  function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080);st.style.transformOrigin="50% 50%";st.style.transform="translate(-50%,-50%) scale("+s+")";}

    trips:{pic:'<img src="/hub/img/trips.jpg" alt="">',t:"TRIPS",s:"My two-part psychedelic comedy special. Free on YouTube."},
